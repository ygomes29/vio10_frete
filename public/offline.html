<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ViO10 — Offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #f4f6fb; color: #1a2233; padding: 2rem; text-align: center;
      }
      .card { max-width: 420px; }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { color: #5b6577; margin: 0 0 1.5rem; }
      button {
        background: #3b6df6; color: #fff; border: 0; border-radius: .625rem;
        padding: .8rem 1.5rem; font-size: 1rem; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Você está offline</h1>
      <p>Sem conexão no momento. Reconecte e tente novamente.</p>
      <button onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
